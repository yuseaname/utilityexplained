baseURL = 'https://utilityexplained.com/'
languageCode = 'en-us'
title = 'Utility Explained'
theme = 'adsense-base'

[params]
  # Central affiliate swap-point — change here, every Amazon link updates sitewide.
  amazon_tag = 'utexplained-20'
  site_name = 'Utility Explained'
  description = 'Plain-English guides to electricity, gas, and water bills so you can budget with confidence, not confusion.'
  tagline = 'Understand your utility bills and save money.'
  author = 'Utility Explained'
  favicon = '/images/og-default.png'
  og_image = '/images/og-default.png'
  google_site_verification = 'M0tDZxQjvpXgWrHqxx4sPIo2gGjWagsHQGFwxh1FJRI'
  google_analytics = 'G-SGVWNS876W'

  [params.rybbit]
    instance_url = 'https://app.rybbit.io'
    site_id = 'd5b63e065e9d'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[permalinks]
  blog = '/blog/:slug'

[permalinks.term]
  categories = '/blog/category/:slug'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[menus]
  [[menus.main]]
    name = "Electricity"
    url = "/electricity-explained/"
    weight = 1
  [[menus.main]]
    name = "Gas"
    url = "/gas-explained/"
    weight = 2
  [[menus.main]]
    name = "Water"
    url = "/water-explained/"
    weight = 3
  [[menus.main]]
    name = "Heating & Cooling"
    url = "/heating-cooling-explained/"
    weight = 4
  [[menus.main]]
    name = "Bill Basics"
    url = "/utility-bills-costs-explained/"
    weight = 5
  [[menus.main]]
    name = "Glossary"
    url = "/utilities-glossary/"
    weight = 6

  [[menus.secondary]]
    name = "All Guides"
    url = "/blog/"
    weight = 1
  [[menus.secondary]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menus.secondary]]
    name = "Our Authors"
    url = "/author/"
    weight = 3

  [[menus.secondary]]
    name = "Contact"
    url = "/contact/"
    weight = 4

  [[menus.footer]]
    name = "Privacy Policy"
    url = "/privacy-policy/"
    weight = 10
  [[menus.footer]]
    name = "Terms"
    url = "/terms/"
    weight = 20
  [[menus.footer]]
    name = "Disclaimer"
    url = "/disclaimer/"
    weight = 30
