{{/* Hero/Featured Image for article pages — responsive, CLS-safe */}}
{{ with . }}
{{ $image := .Params.image }}
{{ if $image }}
  <figure class="hero-figure">
    <div class="hero-figure-frame">
      <img
        src="{{ $image }}"
        alt="{{ with .Params.image_alt }}{{ . }}{{ else }}{{ .Title }}{{ end }}"
        class="hero-img"
        width="1600" height="900"
        loading="eager" fetchpriority="high" decoding="async"
      >
    </div>
    {{ with .Params.image_caption }}
      <figcaption class="hero-caption">{{ . }}</figcaption>
    {{ end }}
  </figure>
{{ end }}
{{ end }}
