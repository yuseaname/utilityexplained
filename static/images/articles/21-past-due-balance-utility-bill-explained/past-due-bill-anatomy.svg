<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a past due balance appears on a utility bill</title>
  <desc id="d">Illustrative utility bill showing previous balance minus payments equaling a past due balance, plus current charges, and the total amount due.</desc>
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Bill card -->
  <rect x="240" y="60" width="720" height="680" rx="18" fill="#ffffff" stroke="#E5E7EB" stroke-width="3"/>
  <rect x="240" y="60" width="720" height="86" rx="18" fill="#2563EB"/>
  <rect x="240" y="120" width="720" height="26" fill="#2563EB"/>
  <text x="600" y="113" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="1">SAMPLE UTILITY BILL</text>

  <!-- Previous balance row -->
  <text x="290" y="210" fill="#374151" font-size="26">Previous balance</text>
  <text x="910" y="210" text-anchor="end" fill="#374151" font-size="26">$142.60</text>
  <line x1="290" y1="230" x2="910" y2="230" stroke="#F3F4F6" stroke-width="2"/>

  <!-- Payments row -->
  <text x="290" y="280" fill="#374151" font-size="26">Payments and credits</text>
  <text x="910" y="280" text-anchor="end" fill="#0D9488" font-size="26" font-weight="700">−$142.60</text>
  <line x1="290" y1="300" x2="910" y2="300" stroke="#F3F4F6" stroke-width="2"/>

  <!-- Current charges row -->
  <text x="290" y="350" fill="#374151" font-size="26">Current charges (this month)</text>
  <text x="910" y="350" text-anchor="end" fill="#374151" font-size="26">$86.20</text>
  <line x1="290" y1="370" x2="910" y2="370" stroke="#F3F4F6" stroke-width="2"/>

  <!-- Past due highlight box -->
  <rect x="270" y="400" width="660" height="110" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
  <text x="310" y="445" fill="#92400E" font-size="27" font-weight="700">PAST DUE BALANCE (carried over)</text>
  <text x="310" y="483" fill="#92400E" font-size="23">Amount that was due last bill and went unpaid</text>
  <text x="910" y="468" text-anchor="end" fill="#B45309" font-size="34" font-weight="800">$56.40</text>

  <line x1="290" y1="545" x2="910" y2="545" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Total row -->
  <text x="290" y="600" fill="#111827" font-size="30" font-weight="800">Total amount due</text>
  <text x="910" y="600" text-anchor="end" fill="#111827" font-size="34" font-weight="800">$142.60</text>
  <text x="290" y="640" fill="#6B7280" font-size="22">Due date: the 15th — pay the past due part first to avoid late steps</text>

  <!-- Side callouts -->
  <g>
    <rect x="0" y="390" width="225" height="130" rx="12" fill="#ECFDF5" stroke="#14B8A6" stroke-width="2.5"/>
    <text x="112" y="440" text-anchor="middle" fill="#0F766E" font-size="22" font-weight="700">Current charges</text>
    <text x="112" y="472" text-anchor="middle" fill="#0F766E" font-size="19">brand-new this</text>
    <text x="112" y="496" text-anchor="middle" fill="#0F766E" font-size="19">billing cycle</text>
    <path d="M 225 455 L 268 455" stroke="#14B8A6" stroke-width="3" marker-end="url(#arrT)"/>
  </g>
  <g>
    <rect x="975" y="390" width="225" height="130" rx="12" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="1087" y="432" text-anchor="middle" fill="#B45309" font-size="22" font-weight="700">Past due = old</text>
    <text x="1087" y="460" text-anchor="middle" fill="#B45309" font-size="19">debt carried onto</text>
    <text x="1087" y="484" text-anchor="middle" fill="#B45309" font-size="19">this month's bill</text>
    <path d="M 975 455 L 932 455" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrA)"/>
  </g>

  <defs>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#14B8A6"/></marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#F59E0B"/></marker>
  </defs>
</svg>
