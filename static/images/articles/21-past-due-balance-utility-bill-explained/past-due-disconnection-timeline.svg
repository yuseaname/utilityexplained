<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Typical utility disconnection timeline after a bill becomes past due</title>
  <desc id="d">Timeline from the due date through grace period, late fee, disconnection warning, and possible disconnection between day 45 and 60.</desc>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" fill="#111827" font-size="30" font-weight="800">What happens after your bill is past due</text>
  <text x="600" y="84" text-anchor="middle" fill="#6B7280" font-size="21">Typical sequence for regulated utilities — exact days vary by state and provider</text>

  <!-- baseline -->
  <line x1="70" y1="330" x2="1130" y2="330" stroke="#D1D5DB" stroke-width="4"/>

  <!-- Day 0 -->
  <circle cx="100" cy="330" r="16" fill="#2563EB"/>
  <text x="100" y="290" text-anchor="middle" fill="#1D4ED8" font-size="24" font-weight="800">Day 0</text>
  <text x="100" y="380" text-anchor="middle" fill="#374151" font-size="21" font-weight="700">Bill due</text>
  <text x="100" y="408" text-anchor="middle" fill="#6B7280" font-size="18">payment missed</text>

  <!-- segment 1: grace -->
  <rect x="150" y="312" width="220" height="36" rx="18" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2.5"/>
  <text x="260" y="290" text-anchor="middle" fill="#0F766E" font-size="24" font-weight="800">Days 1–15</text>
  <text x="260" y="380" text-anchor="middle" fill="#0F766E" font-size="21" font-weight="700">Grace period</text>
  <text x="260" y="408" text-anchor="middle" fill="#6B7280" font-size="18">usually no late fee yet</text>

  <!-- segment 2: late fee -->
  <rect x="390" y="312" width="220" height="36" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="500" y="290" text-anchor="middle" fill="#B45309" font-size="24" font-weight="800">Days 15–30</text>
  <text x="500" y="380" text-anchor="middle" fill="#B45309" font-size="21" font-weight="700">Late fee added</text>
  <text x="500" y="408" text-anchor="middle" fill="#6B7280" font-size="18">1–1.5% is common</text>

  <!-- segment 3: warning -->
  <rect x="630" y="312" width="220" height="36" rx="18" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/>
  <text x="740" y="290" text-anchor="middle" fill="#C2410C" font-size="24" font-weight="800">Days 30–45</text>
  <text x="740" y="380" text-anchor="middle" fill="#C2410C" font-size="21" font-weight="700">Disconnect warning</text>
  <text x="740" y="408" text-anchor="middle" fill="#6B7280" font-size="18">written notice required</text>

  <!-- segment 4: disconnection -->
  <rect x="870" y="312" width="220" height="36" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="980" y="290" text-anchor="middle" fill="#B91C1C" font-size="24" font-weight="800">Days 45–60</text>
  <text x="980" y="380" text-anchor="middle" fill="#B91C1C" font-size="21" font-weight="700">Disconnection</text>
  <text x="980" y="408" text-anchor="middle" fill="#6B7280" font-size="18">service can be shut off</text>

  <!-- arrows on baseline between segments -->
  <path d="M 372 330 L 388 330" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 612 330 L 628 330" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 852 330 L 868 330" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>

  <!-- callout: protections -->
  <rect x="130" y="470" width="940" height="120" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="600" y="512" text-anchor="middle" fill="#1E40AF" font-size="23" font-weight="700">Most states require notice and a chance to set up a payment plan before shutoff.</text>
  <text x="600" y="546" text-anchor="middle" fill="#1E40AF" font-size="21">Medical and weather protections often apply — read the notice, then call the utility.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6B7280"/></marker>
  </defs>
</svg>
