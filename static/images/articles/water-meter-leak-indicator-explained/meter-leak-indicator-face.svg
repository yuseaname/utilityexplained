<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Water meter face with leak indicator explained</title>
  <desc id="d">Labeled diagram of a residential water meter face showing the small triangular leak indicator, the sweep hand, and the usage number wheels.</desc>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" fill="#111827" font-size="30" font-weight="800">Anatomy of a water meter face</text>

  <!-- meter body -->
  <circle cx="560" cy="420" r="290" fill="#374151"/>
  <circle cx="560" cy="420" r="262" fill="#F3F4F6"/>
  <circle cx="560" cy="420" r="248" fill="#ffffff" stroke="#D1D5DB" stroke-width="2"/>

  <!-- tick marks -->
  <g stroke="#9CA3AF" stroke-width="3">
    <line x1="560" y1="184" x2="560" y2="204"/><line x1="796" y1="420" x2="776" y2="420"/>
    <line x1="560" y1="656" x2="560" y2="636"/><line x1="324" y1="420" x2="344" y2="420"/>
    <line x1="726" y1="254" x2="712" y2="268"/><line x1="726" y1="586" x2="712" y2="572"/>
    <line x1="394" y1="586" x2="408" y2="572"/><line x1="394" y1="254" x2="408" y2="268"/>
  </g>
  <!-- minor ticks -->
  <g stroke="#D1D5DB" stroke-width="2">
    <line x1="670" y1="202" x2="662" y2="218"/><line x1="754" y1="300" x2="738" y2="308"/>
    <line x1="782" y1="520" x2="766" y2="512"/><line x1="660" y1="640" x2="652" y2="624"/>
    <line x1="460" y1="640" x2="468" y2="624"/><line x1="338" y1="520" x2="354" y2="512"/>
    <line x1="360" y1="300" x2="376" y2="308"/><line x1="450" y1="202" x2="458" y2="218"/>
  </g>

  <!-- number wheels -->
  <g>
    <rect x="440" y="292" width="240" height="56" rx="8" fill="#ffffff" stroke="#9CA3AF" stroke-width="2"/>
    <g font-size="34" font-weight="700" fill="#111827" text-anchor="middle">
      <text x="470" y="332">0</text><text x="510" y="332">0</text><text x="550" y="332">4</text><text x="590" y="332">7</text><text x="648" y="332" fill="#DC2626">0</text>
    </g>
    <line x1="632" y1="292" x2="632" y2="348" stroke="#DC2626" stroke-width="2"/>
  </g>

  <!-- sweep hand pointing ~4:30 -->
  <line x1="560" y1="420" x2="410" y2="560" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="560" cy="420" r="14" fill="#1D4ED8"/>

  <!-- leak indicator: small triangle at center, red -->
  <polygon points="560,378 582,414 538,414" fill="#DC2626" opacity="0.9"/>
  <circle cx="560" cy="402" r="30" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 5"/>

  <!-- labels left -->
  <g>
    <rect x="30" y="120" width="250" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="155" y="158" text-anchor="middle" fill="#1E40AF" font-size="22" font-weight="700">Leak indicator</text>
    <text x="155" y="186" text-anchor="middle" fill="#1E40AF" font-size="18">triangle, gear, or star</text>
    <path d="M 280 166 L 300 166 L 500 300" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#aB)"/>
  </g>
  <g>
    <rect x="30" y="560" width="250" height="92" rx="12" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2.5"/>
    <text x="155" y="598" text-anchor="middle" fill="#0F766E" font-size="22" font-weight="700">Sweep hand</text>
    <text x="155" y="626" text-anchor="middle" fill="#0F766E" font-size="18">turns as water flows</text>
    <path d="M 280 606 L 320 606 L 424 544" fill="none" stroke="#14B8A6" stroke-width="3" marker-end="url(#aT)"/>
  </g>
  <!-- label right -->
  <g>
    <rect x="920" y="240" width="250" height="110" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
    <text x="1045" y="278" text-anchor="middle" fill="#374151" font-size="22" font-weight="700">Usage wheels</text>
    <text x="1045" y="306" text-anchor="middle" fill="#374151" font-size="18">your running total</text>
    <text x="1045" y="330" text-anchor="middle" fill="#6B7280" font-size="17">(fixed red 0 not counted)</text>
    <path d="M 920 295 L 880 295 L 686 320" fill="none" stroke="#6B7280" stroke-width="3" marker-end="url(#aG)"/>
  </g>

  <!-- bottom rule -->
  <rect x="150" y="716" width="900" height="58" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="600" y="752" text-anchor="middle" fill="#B91C1C" font-size="23" font-weight="700">Leak indicator moving with everything off = water is flowing somewhere. Find it.</text>

  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#2563EB"/></marker>
    <marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#14B8A6"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6B7280"/></marker>
  </defs>
</svg>
