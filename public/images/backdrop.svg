<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Deep ink base -->
  <rect width="1600" height="1000" fill="#0E201C"/>
  <!-- Faint engineering grid -->
  <g stroke="#3c655c" stroke-width="0.5" opacity="0.25" fill="none">
    <path d="M0 50 H1600 M0 100 H1600 M0 150 H1600 M0 200 H1600 M0 250 H1600 M0 300 H1600 M0 350 H1600 M0 400 H1600 M0 450 H1600 M0 500 H1600 M0 550 H1600 M0 600 H1600 M0 650 H1600 M0 700 H1600 M0 750 H1600 M0 800 H1600 M0 850 H1600 M0 900 H1600 M0 950 H1600"/>
    <path d="M50 0 V1000 M100 0 V1000 M150 0 V1000 M200 0 V1000 M250 0 V1000 M300 0 V1000 M350 0 V1000 M400 0 V1000 M450 0 V1000 M500 0 V1000 M550 0 V1000 M600 0 V1000 M650 0 V1000 M700 0 V1000 M750 0 V1000 M800 0 V1000 M850 0 V1000 M900 0 V1000 M950 0 V1000 M1000 0 V1000 M1050 0 V1000 M1100 0 V1000 M1150 0 V1000 M1200 0 V1000 M1250 0 V1000 M1300 0 V1000 M1350 0 V1000 M1400 0 V1000 M1450 0 V1000 M1500 0 V1000 M1550 0 V1000"/>
  </g>
  <!-- Large meter dial, top-left -->
  <g transform="translate(280,260)" opacity="0.32" fill="none" stroke="#5f847a" stroke-width="1.2">
    <circle r="230" stroke-width="1"/>
    <circle r="200"/>
    <circle r="160"/>
    <circle r="120"/>
    <!-- ticks -->
  </g>
  <g transform="translate(280,260)" opacity="0.5" stroke-linecap="round">
    <g stroke="#719e71" stroke-width="2" fill="none">
      <line x1="0" y1="-200" x2="0" y2="-178"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(30)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(60)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(90)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(120)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(150)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(180)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(210)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(240)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(270)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(300)"/>
      <line x1="0" y1="-200" x2="0" y2="-178" transform="rotate(330)"/>
    </g>
    <line x1="0" y1="0" x2="120" y2="-150" stroke="#ebb23a" stroke-width="3"/>
    <circle r="9" fill="#ebb23a" stroke="none"/>
    <circle r="3" fill="#0E201C" stroke="none"/>
  </g>
  <!-- Second smaller dial, bottom-right -->
  <g transform="translate(1280,760)" opacity="0.28" fill="none" stroke="#5f847a" stroke-width="1">
    <circle r="150"/>
    <circle r="125"/>
    <circle r="95"/>
  </g>
  <g transform="translate(1280,760)" opacity="0.45" stroke-linecap="round">
    <g stroke="#719e71" stroke-width="1.8" fill="none">
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(0)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(36)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(72)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(108)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(144)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(180)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(216)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(252)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(288)"/>
      <line x1="0" y1="-130" x2="0" y2="-115" transform="rotate(324)"/>
    </g>
    <line x1="0" y1="0" x2="-80" y2="90" stroke="#ebb23a" stroke-width="2.5"/>
    <circle r="7" fill="#ebb23a" stroke="none"/>
  </g>
  <!-- Blueprint linework: transmission tower (right side) -->
  <g transform="translate(1100,120)" opacity="0.22" fill="none" stroke="#5f847a" stroke-width="1.2">
    <path d="M0 0 L20 360 M80 0 L60 360 M20 0 L80 0 M15 60 L85 60 M10 140 L90 140 M5 240 L95 240 M0 0 L0 -40 M100 0 L100 -40"/>
    <path d="M0 -20 Q50 -50 100 -20 M0 10 Q50 -20 100 10"/>
  </g>
  <!-- Pipe run (bottom-left) -->
  <g transform="translate(40,820)" opacity="0.2" fill="none" stroke="#5f847a" stroke-width="1.5">
    <path d="M0 0 H360 Q400 0 400 -40 V-160 Q400 -200 440 -200 H680"/>
    <path d="M0 30 H340 Q380 30 380 -10 V-170 Q380 -210 420 -210 H680"/>
    <circle cx="680" cy="-200" r="14"/>
    <circle cx="680" cy="-210" r="14"/>
  </g>
  <!-- Rate table hint (center-right) -->
  <g transform="translate(760,420)" opacity="0.16" stroke="#5f847a" stroke-width="1" fill="none">
    <rect x="0" y="0" width="220" height="160" rx="4"/>
    <line x1="0" y1="40" x2="220" y2="40"/>
    <line x1="0" y1="80" x2="220" y2="80"/>
    <line x1="0" y1="120" x2="220" y2="120"/>
    <line x1="110" y1="0" x2="110" y2="160"/>
  </g>
  <!-- Scattered dimension ticks -->
  <g opacity="0.18" stroke="#5f847a" stroke-width="1" fill="none">
    <path d="M600 60 H760 M600 55 V65 M760 55 V65"/>
    <path d="M1400 480 H1560 M1400 475 V485 M1560 475 V485"/>
    <path d="M120 540 H300 M120 535 V545 M300 535 V545"/>
  </g>
</svg>
