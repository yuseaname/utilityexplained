<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="sh-title sh-desc">
  <title id="sh-title">What sewer charges pay for: water in, wastewater out</title>
  <desc id="sh-desc">Flow diagram showing clean water delivered to a home, then wastewater carried to a treatment plant, with an example sewer bill showing volume charge plus fixed fee.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12322b"/>
      <stop offset="1" stop-color="#0e201c"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <text x="76" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#fffdf8" font-weight="bold">What Sewer Charges Pay For</text>
  <text x="76" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#5eead4">Clean water in. Used water out — and treated. Two services, two charges.</text>

  <!-- flow lane -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- water tower -->
    <g transform="translate(96,240)">
      <path d="M60 0 L100 70 L20 70 Z" fill="none" stroke="#5eead4" stroke-width="8"/>
      <rect x="6" y="70" width="108" height="64" rx="10" fill="#5eead4" opacity="0.9"/>
      <path d="M30 134 L30 210 M90 134 L90 210 M20 172 L100 172" stroke="#5eead4" stroke-width="7" fill="none"/>
      <text x="60" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#fffdf8">WATER SERVICE</text>
      <text x="60" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#9db8b0">delivers clean water</text>
    </g>
    <!-- pipe A -->
    <path d="M210 300 C 300 300, 320 300, 400 300" stroke="#5eead4" stroke-width="10" fill="none" stroke-dasharray="26 14"/>
    <path d="M392 286 L414 300 L392 314" fill="#5eead4"/>
    <text x="305" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#5eead4">metered — you pay for water</text>

    <!-- house -->
    <g transform="translate(430,200)">
      <path d="M90 0 L180 78 L0 78 Z" fill="#ebb23a" opacity="0.95"/>
      <rect x="14" y="78" width="152" height="104" fill="none" stroke="#fffdf8" stroke-width="7"/>
      <rect x="40" y="112" width="38" height="38" fill="#0e201c"/>
      <rect x="104" y="112" width="38" height="38" fill="#0e201c"/>
      <rect x="66" y="140" width="48" height="42" fill="#e8a33d"/>
      <text x="90" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#fffdf8">YOUR HOME</text>
      <text x="90" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#9db8b0">usage sets both bills</text>
    </g>

    <!-- pipe B (sewer) -->
    <path d="M640 300 C 720 300, 740 300, 820 300" stroke="#ebb23a" stroke-width="10" fill="none" stroke-dasharray="26 14"/>
    <path d="M812 286 L834 300 L812 314" fill="#ebb23a"/>
    <text x="730" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#f5d98e">wastewater out — you pay to treat it</text>

    <!-- treatment plant -->
    <g transform="translate(860,210)">
      <ellipse cx="70" cy="120" rx="64" ry="22" fill="none" stroke="#5eead4" stroke-width="7"/>
      <path d="M6 120 V64 Q70 36 134 64 V120" fill="none" stroke="#5eead4" stroke-width="7"/>
      <ellipse cx="216" cy="120" rx="64" ry="22" fill="none" stroke="#5eead4" stroke-width="7"/>
      <path d="M152 120 V64 Q216 36 280 64 V120" fill="none" stroke="#5eead4" stroke-width="7"/>
      <path d="M134 96 H152 M280 96 H318" stroke="#5eead4" stroke-width="7"/>
      <circle cx="348" cy="96" r="26" fill="none" stroke="#5eead4" stroke-width="7"/>
      <path d="M348 74 v22 l14 14" stroke="#5eead4" stroke-width="6" fill="none"/>
      <text x="196" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#fffdf8">TREATMENT PLANT</text>
      <text x="196" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#9db8b0">collects, treats, releases safely</text>
    </g>
  </g>

  <!-- bill card -->
  <g transform="translate(76,560)">
    <rect width="620" height="380" rx="18" fill="#fffdf8"/>
    <text x="36" y="64" font-family="system-ui, sans-serif" font-size="26" fill="#0e201c" font-weight="bold">Example: the sewer lines on a water bill</text>
    <line x1="36" y1="84" x2="584" y2="84" stroke="#ebb23a" stroke-width="3"/>
    <g font-family="system-ui, sans-serif" font-size="24" fill="#0e201c">
      <text x="36" y="136">Water consumed</text><text x="584" y="136" text-anchor="end">8 CCF</text>
      <text x="36" y="180">Sewer volume (8 CCF × 80%)</text><text x="584" y="180" text-anchor="end">6.4 CCF</text>
      <text x="36" y="224">Volume charge (× $4.25/CCF)</text><text x="584" y="224" text-anchor="end">$27.20</text>
      <text x="36" y="268">Fixed sewer fee</text><text x="584" y="268" text-anchor="end">$12.00</text>
      <line x1="36" y1="296" x2="584" y2="296" stroke="#0e201c" stroke-width="2"/>
      <text x="36" y="340" font-weight="bold">Total sewer charge</text>
      <text x="584" y="340" text-anchor="end" font-weight="bold" fill="#0e201c">$39.20</text>
    </g>
  </g>

  <!-- why-more box -->
  <g transform="translate(760,560)">
    <rect width="700" height="380" rx="18" fill="none" stroke="#ebb23a" stroke-width="3"/>
    <text x="40" y="64" font-family="system-ui, sans-serif" font-size="26" fill="#f5d98e" font-weight="bold">Why sewer can cost more than water</text>
    <g font-family="system-ui, sans-serif" font-size="23" fill="#fffdf8">
      <circle cx="56" cy="116" r="9" fill="#5eead4"/>
      <text x="86" y="124">Treatment plants, pumps, and pipes run 24/7</text>
      <circle cx="56" cy="170" r="9" fill="#5eead4"/>
      <text x="86" y="178">Fixed infrastructure costs don't shrink with usage</text>
      <circle cx="56" cy="224" r="9" fill="#5eead4"/>
      <text x="86" y="232">Usage-based part drops when you fix leaks</text>
      <circle cx="56" cy="278" r="9" fill="#5eead4"/>
      <text x="86" y="272">Winter-average cities:</text>
      <text x="86" y="304">summer lawn watering doesn't count</text>
    </g>
    <text x="40" y="348" font-family="system-ui, sans-serif" font-size="20" fill="#9db8b0">Rates vary by city — check your utility's rate sheet.</text>
  </g>
</svg>
