<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Utility Explained annotation sprite -->

  <symbol id="ann-needle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.4"/>
    <line x1="12" y1="12" x2="17.5" y2="6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2" fill="currentColor"/>
  </symbol>

  <symbol id="ann-check" viewBox="0 0 24 24">
    <path d="M12 2.5l2.6 5.3 5.9.9-4.2 4.1 1 5.9L12 16.9 6.7 18.7l1-5.9-4.2-4.1 5.9-.9L12 2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>

  <symbol id="ann-divider" viewBox="0 0 200 16" preserveAspectRatio="none">
    <line x1="0" y1="8" x2="200" y2="8" stroke="currentColor" stroke-width="1" opacity="0.25"/>
    <line x1="92" y1="2" x2="108" y2="14" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="ann-stamp" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2"/>
    <path d="M8.5 12.5l2.2 2.2 4.8-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
