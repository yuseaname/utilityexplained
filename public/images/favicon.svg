<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0e201c"/>
  <!-- concentric rings -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#3c655c" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#3c655c" stroke-width="1" opacity="0.3"/>
  <!-- major tick marks -->
  <g stroke="#5f847a" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="13"/>
    <line x1="32" y1="9" x2="32" y2="13" transform="rotate(60 32 32)"/>
    <line x1="32" y1="9" x2="32" y2="13" transform="rotate(120 32 32)"/>
    <line x1="32" y1="9" x2="32" y2="13" transform="rotate(180 32 32)"/>
    <line x1="32" y1="9" x2="32" y2="13" transform="rotate(240 32 32)"/>
    <line x1="32" y1="9" x2="32" y2="13" transform="rotate(300 32 32)"/>
  </g>
  <!-- amber arc (active portion, ~70%) -->
  <path d="M 15.5 42 A 21 21 0 0 1 44.5 17.5" fill="none" stroke="#e8a33d" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- needle pointing to ~70% -->
  <line x1="32" y1="32" x2="43" y2="21" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>
  <!-- hub -->
  <circle cx="32" cy="32" r="3.2" fill="#e8a33d"/>
  <circle cx="32" cy="32" r="1.2" fill="#0e201c"/>
</svg>
