{{ if and (not hugo.IsServer) .Site.Params.google_analytics }}
<!-- Google tag (gtag.js) with Consent Mode v2 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  // Consent Mode v2 — default DENIED until the user chooses via the consent banner.
  // Must be set before gtag.js / adsbygoogle.js load so no ad/analytics cookies fire pre-consent.
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'denied',
    'wait_for_update': 500
  });
  // Restore a prior granted choice so returning visitors aren't re-denied.
  if (localStorage.getItem('ue_consent') === 'granted') {
    gtag('consent', 'update', {
      'ad_storage': 'granted',
      'ad_user_data': 'granted',
      'ad_personalization': 'granted',
      'analytics_storage': 'granted'
    });
  }
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.google_analytics }}"></script>
<script>
  gtag('js', new Date());
  gtag('config', '{{ .Site.Params.google_analytics }}');
</script>
{{ end }}
