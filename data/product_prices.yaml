# Price bands shown on product boxes.
# Policy (P1 wave 2026-10-30): bands are coarse ranges verified against the LIVE
# Amazon listing on the `checked` date, with provenance in `source`. The
# product-box shortcode renders a band ONLY while it is fresh (<= 75 days);
# after that it silently stops rendering until re-verified — a stale price can
# never display. Run `python3 scripts/check_price_bands.py` monthly to see what
# needs re-verification.
B00009MDBU:
  band: "$25–35"
  checked: 2026-10-30
  source: "live Amazon listing (P4400, $29.99 buybox); prior dossier check 2026-08-30 ($15–30 band)"
B0DQLFC3Q6:
  band: "$60–75"
  checked: 2026-10-30
